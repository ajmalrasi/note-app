name: daynote
services:
  daynote:
    build: ../app
    image: daynote:1.0.1
    container_name: daynote
    restart: unless-stopped
    ports:
      - "192.168.3.20:8240:8240"
    environment:
      DAYNOTE_ALLOWED_HOSTS: "192.168.3.20:8240,127.0.0.1:8240,localhost:8240"
      DAYNOTE_SECURE_COOKIE: "false"
      DAYNOTE_PERSONAL_MODE: "true"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
